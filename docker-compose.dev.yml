# Solo levanta Postgres para desarrollo local. La app corre fuera de Docker con `npm run dev`.
# Uso: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reformapro
      POSTGRES_PASSWORD: reformapro
      POSTGRES_DB: reformapro
    ports:
      - "5432:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data

volumes:
  db_data_dev:
